apiVersion: 1

contactPoints:
  - orgId: 1
    name: "Grafana Alerts"   # This name MUST exactly match the receiver
    receivers:
      - uid: "grafana_alerts_email"
        type: email
        disableResolveMessage: true
        settings:
          addresses: "${GF_SMTP_USER}"

groups:
    - orgId: 1
      name: loki-alerts-1m
      folder: Application Alerts
      interval: 1m
      rules:
        - uid: afu68nuebgnwgf
          title: Error Logs Detected
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: loki
              model:
                datasource:
                    type: loki
                    uid: loki
                editorMode: code
                expr: |-
                    sum by (service_name) (
                      count_over_time({service_name=~".+"} | detected_level = "ERROR" [1m])
                    )
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: max
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Alerting
          annotations:
            description: Service '{{ $labels.service_name }}' recorded {{ $values.B.Value }} error(s) in the last minute.
            summary: '[CRITICAL] {{ $labels.service_name }} logged an ERROR'
          isPaused: false
          notification_settings:
            receiver: Grafana Alerts
